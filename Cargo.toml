[workspace]
resolver = "2"

members = [
  "app",
  "engine",
]
default-members = [
  "engine",
]

[profile.release]
lto = "thin"

[profile.opt]
inherits = "release"
lto = "fat"
opt-level = 3

# Enable a small amount of optimization in dev profile
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies (incl. Bevy), but not for our code.
[profile.dev.package."*"]
opt-level = 3
